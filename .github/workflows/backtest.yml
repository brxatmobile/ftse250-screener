name: FTSE Backtest Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 17 * * 6"

permissions:
  contents: write

concurrency:
  group: ftse-backtest-report
  cancel-in-progress: false

jobs:
  build-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance
          fi

      - name: Build backtest report
        env:
          CAPITAL: ${{ vars.CAPITAL }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          BACKTEST_DAYS: ${{ vars.BACKTEST_DAYS }}
          SPREAD_BPS: ${{ vars.SPREAD_BPS }}
          COMMISSION_PER_TRADE: ${{ vars.COMMISSION_PER_TRADE }}
        run: python backtest.py

      - name: Publish backtest page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest.html
          git commit -m "Update FTSE backtest report" || echo "No report changes"
          git push

name: FTSE 30-Day Strategy Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest-research
  cancel-in-progress: false

jobs:
  build-research-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm current research script
        run: |
          test -f backtest_research.py
          grep -q "FTSE350_ORB_RANK1_30DAY_RESEARCH_2026_08_11" backtest_research.py
          echo "Current 30-day opening-range research script found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance
          fi

      - name: Run 30-day rank-1 strategy research
        env:
          SPREAD_BPS: ${{ vars.SPREAD_BPS }}
          COMMISSION_PER_TRADE: ${{ vars.COMMISSION_PER_TRADE }}
        run: |
          python -u ./backtest_research.py

      - name: Verify research output
        run: |
          test -s docs/backtest-research.html
          grep -q "£30 rank-1 strategy" docs/backtest-research.html
          grep -q "15-minute opening-range" docs/backtest-research.html
          grep -q "Daily replay" docs/backtest-research.html
          echo "30-day research report verified"

      - name: Publish research page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-research.html
          git commit -m "Update 30-day rank-1 strategy research" || echo "No research report changes"
          git push

name: FTSE Scoring Research Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest-research
  cancel-in-progress: false

jobs:
  build-research-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance
          fi

      - name: Run scoring research backtest
        env:
          CAPITAL: ${{ vars.CAPITAL }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          BACKTEST_DAYS: ${{ vars.BACKTEST_DAYS }}
          SPREAD_BPS: ${{ vars.SPREAD_BPS }}
          COMMISSION_PER_TRADE: ${{ vars.COMMISSION_PER_TRADE }}
        run: python backtest_research.py

      - name: Verify research output
        run: |
          test -f docs/backtest-research.html
          grep -q "Scoring-model research backtest" docs/backtest-research.html
          grep -q "Current score versus fixed reweighting models" docs/backtest-research.html
          grep -q "Holdout factor evidence" docs/backtest-research.html

      - name: Publish research page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-research.html
          git commit -m "Update FTSE scoring research report" || echo "No research report changes"
          git push

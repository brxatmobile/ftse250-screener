name: FTSE Overnight Exit Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest-research
  cancel-in-progress: false

jobs:
  build-research-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm corrected overnight research script
        run: |
          test -f backtest_research.py
          grep -q "FTSE350_RANK1_OVERNIGHT_RISK_FIX_2026_08_14" backtest_research.py
          echo "Correct overnight research script found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance
          fi

      - name: Run corrected overnight research
        env:
          ROUND_TRIP_COST_BPS: ${{ vars.ROUND_TRIP_COST_BPS }}
          OVERNIGHT_ATR_MULTIPLIER: ${{ vars.OVERNIGHT_ATR_MULTIPLIER }}
          OVERNIGHT_MIN_STOP_PCT: ${{ vars.OVERNIGHT_MIN_STOP_PCT }}
        run: python -u ./backtest_research.py

      - name: Verify output
        run: |
          test -s docs/backtest-research.html
          grep -q "overnight rank-1 strategy" docs/backtest-research.html
          grep -q "Median move at open" docs/backtest-research.html
          echo "Corrected overnight research page verified"

      - name: Publish research page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-research.html
          git commit -m "Fix overnight CFD risk research" || echo "No research report changes"
          git push origin HEAD:main

name: FTSE 30-Day Opposite Strategy Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest-research
  cancel-in-progress: false

jobs:
  build-research-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm checked-out files and research script
        shell: bash
        run: |
          echo "Working directory:"
          pwd
          echo
          echo "Checked-out branch / commit:"
          git branch --show-current
          git rev-parse HEAD
          git log -1 --oneline
          echo
          echo "Repository root files:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort
          echo
          echo "Research files found anywhere in checkout:"
          find . -maxdepth 3 -type f \( -iname 'backtest_research.py' -o -iname 'backtest-research.py' \) -print
          echo

          if [ ! -f "./backtest_research.py" ]; then
            echo "ERROR: ./backtest_research.py is not present in the checked-out main branch."
            echo "The workflow is running commit $(git rev-parse HEAD)."
            exit 1
          fi

          grep -q "FTSE350_ORB_RANK1_30DAY_OPPOSITE_DIRECTION_RESEARCH_2026_08_11" ./backtest_research.py
          echo "Correct opposite-direction 30-day research script found."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance
          fi

      - name: Run opposite-direction 30-day rank-1 strategy research
        env:
          SPREAD_BPS: ${{ vars.SPREAD_BPS }}
          COMMISSION_PER_TRADE: ${{ vars.COMMISSION_PER_TRADE }}
        run: |
          python -u ./backtest_research.py

      - name: Verify research output
        run: |
          test -s docs/backtest-research.html
          grep -q "£30 rank-1 opposite-direction strategy" docs/backtest-research.html
          grep -q "opposite-direction historical replay" docs/backtest-research.html
          grep -q "Daily replay" docs/backtest-research.html
          echo "Opposite-direction 30-day research report verified"

      - name: Publish research page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-research.html
          git commit -m "Update opposite-direction 30-day research" || echo "No research report changes"
          git push origin HEAD:main

name: FTSE Overnight Rank-1 Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftse-backtest-research
  cancel-in-progress: false

jobs:
  build-research-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Confirm overnight research script
        run: |
          test -f backtest_research.py
          grep -q "FTSE350_RANK1_CLOSE_TO_NEXT_DAY_1R_VS_2R_2026_08_14" backtest_research.py
          echo "Correct overnight rank-1 research script found"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy requests yfinance
          fi

      - name: Run overnight rank-1 research
        env:
          ROUND_TRIP_COST_BPS: ${{ vars.ROUND_TRIP_COST_BPS }}
        run: |
          python -u ./backtest_research.py

      - name: Verify research output
        run: |
          test -s docs/backtest-research.html
          grep -q "£30 overnight rank-1 strategy" docs/backtest-research.html
          grep -q "1R versus 2R" docs/backtest-research.html
          grep -q "Avg move at open" docs/backtest-research.html
          echo "Overnight rank-1 research report verified"

      - name: Publish research page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-research.html
          git commit -m "Update overnight rank-1 CFD research" || echo "No research report changes"
          git push origin HEAD:main

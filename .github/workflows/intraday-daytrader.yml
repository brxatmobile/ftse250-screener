name: FTSE Opening-Hour Day-Trade Review

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build or retain the intraday report"
        required: true
        type: choice
        options:
          - analyse
          - expire
        default: analyse

  schedule:
    # Both UTC times are included to cover GMT and BST.
    # The London-time check allows only the 09:05 run to continue.
    - cron: "5 8 * * 1-5"
    - cron: "5 9 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-intraday-page:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check London run time
        if: github.event_name == 'schedule'
        run: |
          london_time=$(TZ=Europe/London date +%H:%M)
          echo "Current London time: $london_time"

          if [ "$london_time" != "09:05" ]; then
            echo "Seasonal duplicate run. Stopping successfully."
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record daily page checksum
        run: |
          sha256sum docs/index.html > /tmp/index-before.sha256

      - name: Build intraday report
        env:
          CAPITAL: ${{ vars.CAPITAL }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          TOP_N: ${{ vars.TOP_N }}
          MAX_GAP_PCT: ${{ vars.MAX_GAP_PCT }}
          TARGET_R: ${{ vars.TARGET_R }}
          MIN_INTRADAY_SCORE: ${{ vars.MIN_INTRADAY_SCORE }}
          MIN_OPENING_VOLUME_RATIO: ${{ vars.MIN_OPENING_VOLUME_RATIO }}
          MAX_VWAP_DISTANCE_PCT: ${{ vars.MAX_VWAP_DISTANCE_PCT }}
          ENTRY_BUFFER_PCT: ${{ vars.ENTRY_BUFFER_PCT }}
          MAX_ENTRY_EXTENSION_R: ${{ vars.MAX_ENTRY_EXTENSION_R }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python intraday_daytrader.py \
              --mode "${{ inputs.mode }}" \
              --force
          else
            python intraday_daytrader.py --mode auto
          fi

      - name: Verify pages
        run: |
          test -s docs/intraday.html
          sha256sum --check /tmp/index-before.sha256

          grep -q 'Past the 10:00 cutoff' docs/intraday.html
          grep -q 'PAST 10:00' docs/intraday.html
          grep -q 'id="live-content"' docs/intraday.html

      - name: Commit intraday page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- docs/intraday.html
          git commit -m "Update FTSE intraday report" || echo "No intraday changes"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

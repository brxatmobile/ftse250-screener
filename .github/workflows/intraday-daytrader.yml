name: FTSE 08:05 Opening Breakout Review

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build or retain the intraday report"
        required: true
        type: choice
        options:
          - analyse
          - expire
        default: analyse

  schedule:
    # Run just after the first five-minute bar completes.
    # 08:07 London: 07:07 UTC during BST and 08:07 UTC during GMT.
    - cron: "7 7 * * 1-5"
    - cron: "7 8 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-intraday-page:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Decide whether scheduled run should continue
        id: london_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          hour=$(TZ=Europe/London date +%H)
          minute=$(TZ=Europe/London date +%M)
          total=$((10#$hour * 60 + 10#$minute))

          # Accept delayed starts from 08:05 through 08:25 London time.
          if [ "$total" -ge 485 ] && [ "$total" -le 505 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.london_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.london_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Record daily page checksum
        if: steps.london_gate.outputs.should_run == 'true'
        run: sha256sum docs/index.html > /tmp/index-before.sha256

      - name: Build opening breakout report
        if: steps.london_gate.outputs.should_run == 'true'
        env:
          CAPITAL: ${{ vars.CAPITAL }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          CANDIDATE_POOL_N: ${{ vars.CANDIDATE_POOL_N }}
          MAX_GAP_PCT: ${{ vars.MAX_GAP_PCT }}
          TARGET_R: ${{ vars.TARGET_R }}
          MIN_OPENING_VOLUME_RATIO: ${{ vars.MIN_OPENING_VOLUME_RATIO }}
          MIN_OPENING_TURNOVER_GBP: ${{ vars.MIN_OPENING_TURNOVER_GBP }}
          MAX_VWAP_DISTANCE_PCT: ${{ vars.MAX_VWAP_DISTANCE_PCT }}
          ENTRY_BUFFER_PCT: ${{ vars.ENTRY_BUFFER_PCT }}
          MAX_ENTRY_EXTENSION_R: ${{ vars.MAX_ENTRY_EXTENSION_R }}
          MAX_ACTIONABLE_TRADES: ${{ vars.MAX_ACTIONABLE_TRADES }}
          MIN_ACTIONABLE_SCORE: ${{ vars.MIN_ACTIONABLE_SCORE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python intraday_daytrader.py --mode "${{ inputs.mode }}" --force
          else
            python intraday_daytrader.py --mode auto
          fi

      - name: Verify generated intraday page
        if: steps.london_gate.outputs.should_run == 'true'
        run: |
          test -s docs/intraday.html
          sha256sum --check /tmp/index-before.sha256

      - name: Commit intraday page
        if: steps.london_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/intraday.html
          git commit -m "Update FTSE 08:05 breakout report" || echo "No intraday changes"
          git push

      - name: Configure GitHub Pages
        if: steps.london_gate.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload complete website
        if: steps.london_gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: steps.london_gate.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
